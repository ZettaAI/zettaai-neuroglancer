server {
    listen 8080;
    server_name _;
    server_tokens off;
    charset utf-8;

    root /usr/share/nginx/html;
    index index.html;

    gzip_static on;
    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

    # TM-324: cross-origin isolation stays off until the calcada auth flow works
    # under COEP. Mirrors the deliberately empty `headers` in vercel.json.
    # add_header Cross-Origin-Opener-Policy same-origin always;
    # add_header Cross-Origin-Embedder-Policy credentialless always;

    # Content-hashed filenames: `main.<chunkhash>.js`, `<contenthash>.wasm`.
    location ~ "[0-9a-f]{16}\.(js|css|wasm)(\.map)?$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Everything else, including index.html and the unhashed pyodide assets.
    # Matches what Vercel served for the whole site.
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri $uri/ =404;
    }
}
