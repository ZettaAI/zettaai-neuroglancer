name: Deploy to Cloud Run

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      template:
        description: Service whose config seeds `service` when it does not exist yet
        required: false
        type: string
        default: ""
      public:
        required: false
        type: boolean
        default: false
  push:
    branches: [dev, main]

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  PROJECT_ID: zetta-research
  PROJECT_NUMBER: "349854005841"
  REGION: us-east1
  ALIAS_DOMAIN: research.zetta.ai
  IMAGE: us-east1-docker.pkg.dev/zetta-research/neuroglancer/zettaai-neuroglancer

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.targets.outputs.services }}
    env:
      BRANCH_SERVICES: |
        dev: neuroglancer-dev
        main: neuroglancer
    steps:
      - id: targets
        run: |
          set -euo pipefail
          if [ -n "$INPUT_SERVICE" ]; then
            services="$INPUT_SERVICE"
          else
            services=$(printf '%s\n' "$BRANCH_SERVICES" | awk -v b="$GITHUB_REF_NAME" '
              { line = $0; gsub(/^[ \t]+|[ \t]+$/, "", line) }
              index(line, b ":") == 1 { print substr(line, length(b) + 2) }
            ')
          fi
          json=$(printf '%s' "$services" | jq -Rc 'splits("[ \t]+") | select(length > 0)' | jq -sc .)
          if [ "$json" = "[]" ]; then
            echo "::error::No Cloud Run service is mapped to $GITHUB_REF_NAME"
            exit 1
          fi
          echo "Deploying $json"
          echo "services=$json" >> "$GITHUB_OUTPUT"
        env:
          INPUT_SERVICE: ${{ inputs.service }}

  deploy:
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.targets.outputs.services) }}
    concurrency:
      group: deploy-${{ matrix.service }}
      cancel-in-progress: true
    env:
      SERVICE: ${{ matrix.service }}
      TEMPLATE: ${{ inputs.template }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        id: auth
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          token_format: access_token

      - uses: google-github-actions/setup-gcloud@v2

      - name: Resolve config source
        run: |
          set -euo pipefail
          existing=$(gcloud run services list --project="$PROJECT_ID" --region="$REGION" \
            --filter="metadata.name=$SERVICE" --format='value(metadata.name)')
          if [ -n "$existing" ]; then
            source="$SERVICE"
          elif [ -n "$TEMPLATE" ]; then
            source="$TEMPLATE"
          else
            echo "::error::Service $SERVICE does not exist and no template was given"
            exit 1
          fi
          gcloud run services describe "$source" \
            --project="$PROJECT_ID" --region="$REGION" --format=json > /tmp/source.json
          jq -r '(.spec.template.spec.containers[0].env // [])[]
                 | select(.name | startswith("NEUROGLANCER_")) | select(.value != null)
                 | "--build-arg=\(.name)=\(.value)"' /tmp/source.json > /tmp/build.args
          echo "Config from $source, $(wc -l < /tmp/build.args) build args"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push
        run: |
          mapfile -t args < /tmp/build.args
          docker buildx build \
            --platform linux/amd64 \
            --tag "$IMAGE:$GITHUB_SHA-$SERVICE" \
            --secret id=npm_token,env=NPM_TOKEN \
            "${args[@]}" \
            --cache-from "type=registry,ref=$IMAGE:cache" \
            --cache-from "type=registry,ref=$IMAGE:cache-$SERVICE" \
            --cache-to "type=registry,ref=$IMAGE:cache-$SERVICE,mode=max" \
            --provenance=false \
            --push .
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Deploy
        id: deploy
        run: |
          set -euo pipefail
          alias="$SERVICE.$ALIAS_DOMAIN"
          if getent hosts "$alias" >/dev/null; then
            url="https://$alias"
          else
            url="https://$SERVICE-$PROJECT_NUMBER.$REGION.run.app"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          args=(--project="$PROJECT_ID" --region="$REGION" --image="$IMAGE:$GITHUB_SHA-$SERVICE" --quiet)
          exists=$(gcloud run services list --project="$PROJECT_ID" --region="$REGION" \
            --filter="metadata.name=$SERVICE" --format='value(metadata.name)')
          if [ -z "$exists" ]; then
            jq '(.spec.template.spec.containers[0].env // [])
                | map(select(.value != null)) | from_entries' /tmp/source.json > /tmp/env.json
            if [ "$(jq -r 'length' /tmp/env.json)" -gt 0 ]; then
              args+=(--env-vars-file=/tmp/env.json)
            fi
            args+=(
              --memory="$(jq -r '.spec.template.spec.containers[0].resources.limits.memory // "512Mi"' /tmp/source.json)"
              --cpu="$(jq -r '.spec.template.spec.containers[0].resources.limits.cpu // "1"' /tmp/source.json)"
              --port="$(jq -r '.spec.template.spec.containers[0].ports[0].containerPort // 8080' /tmp/source.json)"
            )
          fi
          if [ "$PUBLIC" = true ]; then
            args+=(--allow-unauthenticated)
          fi
          gcloud run deploy "$SERVICE" "${args[@]}"
        env:
          PUBLIC: ${{ inputs.public }}

      - name: Comment the preview URL on the PR
        if: inputs.template != ''
        continue-on-error: true
        run: |
          set -euo pipefail
          pr=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            echo "No open PR for $BRANCH, nothing to comment on"
            exit 0
          fi
          gh pr comment "$pr" --repo "$REPO" --body "**Cloud Run preview** for \`${GITHUB_SHA:0:8}\` is ready — [$SERVICE]($URL)

          It is not redeployed automatically: re-run the \`Deploy preview\`
          workflow on this branch, or toggle the \`deploy-preview\` label.
          Closing this PR deletes the service."
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          URL: ${{ steps.deploy.outputs.url }}
