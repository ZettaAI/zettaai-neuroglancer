name: Deploy preview

on:
  pull_request:
    types: [opened, labeled, closed]
  workflow_dispatch:
    inputs:
      delete:
        description: Delete the preview instead of deploying it
        type: boolean
        default: false

concurrency:
  group: preview-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  pull-requests: write
  deployments: write

jobs:
  name:
    if: >-
      !contains(fromJSON('["dev","main"]'), github.head_ref || github.ref_name) &&
      (github.event_name == 'workflow_dispatch' ||
        github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      service: ${{ steps.name.outputs.service }}
      pr: ${{ steps.name.outputs.pr }}
    steps:
      - id: name
        run: |
          set -euo pipefail
          if [ -z "$PR" ]; then
            PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state all \
              --json number --jq 'max_by(.number).number // empty')
          fi
          if [ -z "$PR" ]; then
            echo "::error::No PR found for $BRANCH; previews are named after the PR"
            exit 1
          fi
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          echo "service=neuroglancer-pr-$PR" >> "$GITHUB_OUTPUT"
        env:
          PR: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          GH_TOKEN: ${{ github.token }}

  deploy:
    needs: name
    if: >-
      (github.event_name == 'workflow_dispatch' && !inputs.delete) ||
      (github.event.action == 'labeled' && github.event.label.name == 'deploy-preview') ||
      (github.event.action == 'opened' &&
        contains(github.event.pull_request.labels.*.name, 'deploy-preview'))
    uses: ./.github/workflows/deploy-cloud-run.yml
    with:
      service: ${{ needs.name.outputs.service }}
      template: neuroglancer-dev
      public: true
    secrets: inherit

  record:
    name: Record preview-pr-${{ needs.name.outputs.pr }}
    needs: [name, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: preview-pr-${{ needs.name.outputs.pr }}
      url: ${{ needs.deploy.outputs.url }}
    steps:
      - run: echo "Preview of PR ${{ needs.name.outputs.pr }} is live"

  teardown:
    needs: name
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.delete) ||
      github.event.action == 'closed'
    uses: ./.github/workflows/preview-teardown.yml
    with:
      pr: ${{ fromJSON(needs.name.outputs.pr) }}
      reason: ${{ github.event.action == 'closed' && 'the PR is closed' || format('@{0} deleted it', github.actor) }}
    secrets: inherit
